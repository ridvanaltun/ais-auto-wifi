name: Release

# Cut a release from the Actions tab: bumps the version automatically, tags it,
# and publishes a GitHub Release whose changelog is generated from the commits
# since the previous release. A downloadable .app is attached when it builds.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write  # push the version-bump commit/tag and create the release

jobs:
  release:
    runs-on: macos-14
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the changelog can be generated

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (release gate)
        run: python -m unittest discover -s tests

      - name: Bump version
        id: bump
        run: |
          NEW=$(python3 scripts/bump_version.py "${{ inputs.bump }}")
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW"

      - name: Commit, tag and push
        run: |
          VER="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VER"
          git tag -a "v$VER" -m "Release v$VER"
          git push origin HEAD:main
          git push origin "v$VER"

      - name: Create GitHub Release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.bump.outputs.version }}"
          gh release create "v$VER" --title "v$VER" --generate-notes

  app:
    # Best-effort downloadable app: if the build fails, the release above still
    # stands (with the automatic source archives), so this never blocks it.
    needs: release
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "v${{ needs.release.outputs.version }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt py2app

      - name: Build the .app
        run: python3 setup_app.py py2app

      - name: Zip and upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ needs.release.outputs.version }}"
          APP="dist/AIS Wi-Fi Auto-Login.app"
          ZIP="AIS-Wi-Fi-Auto-Login-v$VER.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          gh release upload "v$VER" "$ZIP" --clobber
